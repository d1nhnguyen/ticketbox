services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketbox_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: ticketbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketbox_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketbox_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  mock-gateway:
    build:
      context: ./src/mock-gateway
    container_name: ticketbox_mock_gateway
    ports:
      - "4000:4000"
    environment:
      GATEWAY_MODE: success
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./src/backend
    container_name: ticketbox_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/ticketbox?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret_dev
      NODE_ENV: production
      MOCK_PAYMENT_URL: http://mock-gateway:4000
      VNPAY_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SECURE: "false"
      MAIL_FROM: "TicketBox <no-reply@ticketbox.local>"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-gateway:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ./src/web
      args:
        VITE_API_URL: http://localhost:3000
        VITE_SCANNER_URL: http://localhost:5174
    container_name: ticketbox_web
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  scanner:
    build:
      context: ./src/scanner
      args:
        VITE_API_URL: http://localhost:3000
    container_name: ticketbox_scanner
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
