services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketbox_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: ticketbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketbox_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-gateway:
    build:
      context: ./src/mock-gateway
    container_name: ticketbox_mock_gateway
    ports:
      - "4000:4000"
    environment:
      GATEWAY_MODE: success

  backend:
    build:
      context: ./src/backend
    container_name: ticketbox_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/ticketbox?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret_dev
    volumes:              
      - ./data:/data       
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:20-alpine
    container_name: ticketbox_web
    working_dir: /app
    volumes:
      - ./src/web:/app
    ports:
      - "5173:5173"
    environment:
      # Browser-facing URL — keep localhost:<host-port>, not a service DNS name
      VITE_SCANNER_URL: http://localhost:5174
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  scanner:
    image: node:20-alpine
    container_name: ticketbox_scanner
    working_dir: /app
    volumes:
      - ./src/scanner:/app
    ports:
      - "5174:5174"
    environment:
      # Browser-facing URL — keep localhost:<host-port>, not a service DNS name
      VITE_API_URL: http://localhost:3000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
